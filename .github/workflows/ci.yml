name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge fmt --check
        continue-on-error: true
      - run: forge build --sizes
      - run: forge test -vvv

  artifact-drift:
    name: embedded bytecode is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: contracts
      - run: node script/compile-check.js
        working-directory: contracts
      - name: fail if the frontend bytecode copy drifted
        run: |
          diff <(tr -d ' 
' < bot/crates/mev-bot/artifacts/MevExecutor.creation.hex)                <(tr -d ' 
' < frontend/lib/MevExecutor.creation.hex)             || { echo "frontend/lib/MevExecutor.creation.hex differs from the bot artifact — the go-live panel would deploy stale bytecode; re-copy it"; exit 1; }
      - name: fail if the checked-in artifact drifted
        run: git diff --exit-code -- bot/crates/mev-bot/artifacts contracts/abi

  bot:
    name: bot (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bot
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --all-targets -- -A clippy::too_many_arguments
      - run: cargo test --all

  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
