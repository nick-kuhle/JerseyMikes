[package]
name = "mev-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Simulation-only MEV search engine: sandwich, JIT, atomic arb, liquidation and token sniping"

[[bin]]
name = "mev-bot"
path = "src/main.rs"

[dependencies]
# async runtime / networking
tokio = {version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util", "net"]}
tokio-tungstenite = {version = "0.24", features = ["rustls-tls-webpki-roots"]}
futures-util = "0.3"
reqwest = {version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"]}
axum = "0.7"
tower-http = {version = "0.5", features = ["cors", "trace"]}

# serialization
serde = {version = "1", features = ["derive"]}
serde_json = "1"
hex = "0.4"

# evm primitives / abi
alloy-primitives = {version = "0.8", features = ["serde", "rand"]}
alloy-sol-types = "0.8"
k256 = {version = "0.13", features = ["ecdsa"]}
rand = "0.8"

# storage
rusqlite = {version = "0.32", features = ["bundled"]}

# misc
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
clap = {version = "4", features = ["derive", "env"]}
dotenvy = "0.15"
async-trait = "0.1"
parking_lot = "0.12"
uuid = {version = "1", features = ["v4"]}

[dev-dependencies]
tokio = {version = "1.40", features = ["full", "test-util"]}
