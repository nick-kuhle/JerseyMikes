[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "cancun"
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
mainnet = "${ETH_HTTP_URL}"

[etherscan]
mainnet = {key = "${ETHERSCAN_API_KEY}"}
